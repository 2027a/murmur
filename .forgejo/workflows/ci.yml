---
name: CI

"on":
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  verify-amd64:
    name: amd64 / Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.23.12"
          - "1.26.5"
    env:
      CGO_ENABLED: "1"
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Check clean checkout
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Go
        # actions/setup-go v5.0.2
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: ${{ matrix.go }}
          check-latest: false
          cache: false

      - name: Check native architecture
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          test "$(go env GOOS)/$(go env GOARCH)" = linux/amd64

      - name: Clear Go command caches
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
        run: go clean -cache -testcache

      - name: Download locked modules
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
        run: timeout --signal=TERM --kill-after=30s 5m go mod download

      - name: Verify modules
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
          GOPROXY: "off"
        run: timeout --signal=TERM --kill-after=30s 2m make module-check

      - name: Lint
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
          GOPROXY: "off"
        run: timeout --signal=TERM --kill-after=30s 10m make lint

      - name: Test
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
          GOPROXY: "off"
        run: timeout --signal=TERM --kill-after=30s 20m make test

      - name: Build
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
          GOPROXY: "off"
        run: timeout --signal=TERM --kill-after=30s 5m make build

      - name: Check installation contract
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
          GOPROXY: "off"
        run: timeout --signal=TERM --kill-after=30s 10m make installcheck

  build-arm64:
    name: arm64 cross-build / Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.23.12"
          - "1.26.5"
    env:
      CGO_ENABLED: "0"
      GOARCH: arm64
      GOFLAGS: -mod=readonly
      GOOS: linux
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Check clean checkout
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Go
        # actions/setup-go v5.0.2
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: ${{ matrix.go }}
          check-latest: false
          cache: false

      - name: Clear Go command caches
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
        run: go clean -cache -testcache

      - name: Download locked modules
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
        run: timeout --signal=TERM --kill-after=30s 5m go mod download

      - name: Build linux/arm64
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
          GOPROXY: "off"
        run: timeout --signal=TERM --kill-after=30s 5m make build

      - name: Check binary architecture
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          metadata="$(go version -m build/murmur)"
          printf '%s\n' "$metadata"
          case "$metadata" in
            *$'\tbuild\tGOARCH=arm64'*) ;;
            *) exit 1 ;;
          esac
          case "$metadata" in
            *$'\tbuild\tGOOS=linux'*) ;;
            *) exit 1 ;;
          esac
